<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Down Shooter</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center; /* Center the main wrapper */
        }

        #game-wrapper {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        #main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #gameCanvas {
            border: 2px solid #444;
            background-color: #333;
            cursor: crosshair;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 1000px;
            padding: 5px 0;
            font-size: 1.1em;
        }

        .scoreboard-header {
            font-size: 1.5em;
            font-weight: bold;
        }

        .team1 { color: #4CAF50; }
        .team2 { color: #F44336; }

        .player-stats, .game-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        #controls {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }

        #playerNameInput, #weaponSelector {
            background-color: #444;
            color: white;
            border: 1px solid #666;
            padding: 3px;
            border-radius: 3px;
        }

        #playerNameInput {
            width: 120px;
        }

        /* --- New Scoreboard Styles --- */
        #scoreboard-container {
            width: 280px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 5px;
            max-height: 850px;
            overflow-y: auto;
        }

        #scoreboard-container h2 {
            text-align: center;
            margin-top: 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #555;
        }

        #scoreboard-container h3 {
            margin-top: 20px;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #555;
        }

        #scoreboard-container ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .scoreboard-player {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px;
            border-bottom: 1px solid #3a3a3a;
            font-size: 0.9em;
        }

        .scoreboard-player:last-child {
            border-bottom: none;
        }

        .player-name {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 10px;
        }

        .player-score {
            font-weight: bold;
            flex-shrink: 0;
        }

        .local-player-highlight {
            font-weight: bold;
            color: #FFC107; /* Highlight color for the local player */
        }

        #player-config {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #444;
        }

        #player-config h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #ccc;
            font-size: 1.1em;
            border-bottom: none; /* Override general h3 style */
        }

        .config-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .config-item label {
            margin-right: 10px;
            color: #aaa;
        }

        #playerNameInput, #weaponSelector {
            flex-grow: 1; /* Make them fill the available space */
        }

        #leaveGameBtn {
            background-color: #a1322a;
            color: white;
            border: 1px solid #c7574e;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            width: 100%;
            box-sizing: border-box;
        }
        #leaveGameBtn:hover {
            background-color: #c7574e;
        }

        /* --- Styles for the Redesigned Info Bar --- */
        .game-info-left, .game-info-right {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1; /* Allow sections to grow and shrink */
        }

        .game-info-right {
            justify-content: flex-end; /* Align items to the right */
        }
    </style>
</head>
<body>
<div id="game-wrapper">
    <div id="main-content">
        <div class="info-bar">
            <div class="game-info-left">
                <span>Team: <b id="yourTeam">?</b></span>
                <span>Players: <b id="playerCount">0</b></span>
            </div>
            <div class="scoreboard-header">
                <span id="team1Score" class="team1">0</span>
                <span id="roundTimer" style="margin: 0 20px; color: #FFC107;">00:00</span>
                <span id="team2Score" class="team2">0</span>
            </div>
            <div class="game-info-right">
                <span>Ping: <b id="latency" style="color: white;">--</b> ms</span>
                <span>Status: <b id="status" style="color: #FFC107;">Connecting...</b></span>
            </div>
        </div>
        <canvas id="gameCanvas" width="1000" height="800" tabindex="-1" style="outline: none;"></canvas>
    </div>

    <div id="scoreboard-container">
        <h2>Scoreboard <span id="gameIdIndicator" style="font-size: 0.6em; color: #aaa; font-weight: normal;"></span>
        </h2>
        <h4 id="gameModeDisplay"
            style="text-align: center; margin-top: -5px; margin-bottom: 15px; color: #ccc; font-weight: normal;">
            Loading...</h4>

        <div id="player-config">
            <div class="config-item">
                <label for="playerNameInput">Name:</label>
                <input type="text" id="playerNameInput" placeholder="Your Name">
            </div>
            <div class="config-item">
                <label for="weaponSelector">Weapon:</label>
                <select id="weaponSelector">
                    <option>Loading...</option>
                </select>
            </div>
        </div>

        <div id="team1-scoreboard">
            <h3 class="team1">Team 1</h3>
            <ul id="team1-players">
                <!-- Team 1 players will be populated here -->
            </ul>
        </div>
        <div id="team2-scoreboard">
            <h3 class="team2">Team 2</h3>
            <ul id="team2-players">
                <!-- Team 2 players will be populated here -->
            </ul>
        </div>
        <div id="controls" style="text-align: left; padding-left: 10px;">
            <p><strong>Controls:</strong></p>
            <p>⌨️ WASD/Arrows: Move | R: Reload | Mouse: Aim & Shoot</p>
            <p>🎮 Left Stick: Move | Right Stick: Aim | Y/△: Swap Weapon | X/□: Reload | RT/R2: Shoot</p>
        </div>
        <div style="text-align: center; margin-top: 20px; padding: 0 5px;">
             <button id="leaveGameBtn">Leave Game</button>
        </div>
    </div>
</div>


<script>
    class Game {
        constructor() {
            this.canvas = document.getElementById('gameCanvas');
            this.ctx = this.canvas.getContext('2d');
            this.ws = null;
            this.resetGameState();
            this.keys = {};
            this.mouse = { x: 0, y: 0, down: false };
            this.playerId = null;
            this.playerTeam = null;
            this.isLocalPlayerDead = false;
            this.shouldDrawRespawnOverlay = true;
            this.gamepad = null;
            this.isGamepadActive = false;
            this.gamepadAim = { x: 1, y: 0 }; // Default aim direction
            this.gamepadWeaponSwapPressed = false; // Track previous state of the gamepad swap button

            this.latency = 0;
            this.pingStartTime = 0;

            this.backgroundCanvas = document.createElement('canvas');
            this.backgroundCtx = this.backgroundCanvas.getContext('2d');
            this.currentGameType = '';
            this.backgroundNeedsRedraw = true; // Flag to trigger a redraw

            this.lastScoreboardUpdateTime = 0;
            this.SCOREBOARD_UPDATE_INTERVAL = 1000; // Update scoreboard once a second

            this.loadPlayerName();
            this.setupEventListeners();
            this.connect();
            this.startGameLoop();
        }

        resetGameState() {
            this.gameState = { players: [], bullets: [], obstacles: [], deathMarkers: [], events: [], info: null };
        }

        connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            // --- Read query parameters to join a specific game ---
            const urlParams = new URLSearchParams(window.location.search);
            const gameId = urlParams.get('gameId') || 'null';
            const gameType = urlParams.get('gameType') || 'null';
            let wsUrl = `${protocol}//${location.hostname}:${location.port}/game/${gameId}/${gameType}`;

            this.ws = new WebSocket(wsUrl);

            this.backgroundCanvas.width = this.canvas.width;
            this.backgroundCanvas.height = this.canvas.height;

            this.ws.onopen = () => {
                document.getElementById('status').textContent = 'Connected';
                document.getElementById('status').style.color = '#4CAF50';

                // Start sending pings to measure latency
                // Ping every 2 seconds
                setInterval(() => {
                    this.pingStartTime = Date.now();
                    this.ws.send(JSON.stringify({ type: 'ping' }));
                }, 2000);
            };

            this.ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                // Handle pong message for latency calculation
                if (data.type === 'pong') {
                    this.latency = Date.now() - this.pingStartTime;
                    const latencyEl = document.getElementById('latency');
                    latencyEl.textContent = this.latency;

                    // Change color based on latency value for quick feedback
                    if (this.latency > 150) {
                        latencyEl.style.color = '#F44336'; // Red for high latency
                    } else if (this.latency > 80) {
                        latencyEl.style.color = '#FFC107'; // Yellow for medium latency
                    } else {
                        latencyEl.style.color = 'white'; // Default color
                    }
                    return;
                }

                if (data.type === 'welcome') {
                    this.playerId = data.playerId;
                    this.playerTeam = data.team;
                    this.backgroundNeedsRedraw = true;
                    this.resetGameState();

                    // Update the UI with team info
                    const teamElement = document.getElementById('yourTeam');
                    teamElement.textContent = this.playerTeam;
                    teamElement.className = `team${this.playerTeam}`;
                    // Update the Game ID display in the scoreboard header
                    if (data.gameId) {
                       document.getElementById('gameIdIndicator').textContent = `(gameId: ${data.gameId})`;
                    }
                    // Populate weapon selector if the data is available
                    if (data.weaponOptions) {
                        this.populateWeaponSelector(data.weaponOptions);
                    }
                } else {
                    // Assume it's a game state update if no type is specified
                    this.gameState = data;
                    this.updateUI();
                }
            };

            this.ws.onclose = () => {
                document.getElementById('status').textContent = 'Disconnected';
                document.getElementById('status').style.color = '#F44336';
                this.resetGameState();
                // TODO: disabled auto re-connect because of our AFK timeout
                //setTimeout(() => this.connect(), 3000);
            };

            this.ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        setupEventListeners() {
            // Keyboard events
            document.addEventListener('keydown', (e) => { this.keys[e.code] = true; });
            document.addEventListener('keyup', (e) => { this.keys[e.code] = false; });

            // Mouse events
            this.canvas.addEventListener('mousemove', (e) => {
                const rect = this.canvas.getBoundingClientRect();
                this.mouse.x = e.clientX - rect.left;
                this.mouse.y = e.clientY - rect.top;
            });
            this.canvas.addEventListener('mousedown', (e) => { if (e.button === 0) this.mouse.down = true; });
            this.canvas.addEventListener('mouseup', (e) => { if (e.button === 0) this.mouse.down = false; });
            this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            // Player config listeners
            document.getElementById('playerNameInput').addEventListener('change', () => {
                this.sendConfigChange();
                this.canvas.focus();
            });
            document.getElementById('weaponSelector').addEventListener('change', () => {
                this.sendConfigChange();
                this.canvas.focus();
            });
            document.getElementById('leaveGameBtn').addEventListener('click', () => {
                window.location.href = 'lobby.html';
            });
        }

        /**
         * Polls for gamepad state. The Gamepad API is not event-based,
         * so we must check it on every frame.
         */
        pollGamepad() {
            const gamepads = navigator.getGamepads();
            const firstGamepad = gamepads[0] || gamepads[1] || gamepads[2] || gamepads[3];

            if (firstGamepad) {
                this.gamepad = firstGamepad;
                // A stick movement or button press "activates" the gamepad mode
                const stickMoved = Math.abs(this.gamepad.axes[0]) > 0.1 ||
                                   Math.abs(this.gamepad.axes[1]) > 0.1 ||
                                   Math.abs(this.gamepad.axes[2]) > 0.1 ||
                                   Math.abs(this.gamepad.axes[3]) > 0.1;
                const buttonPressed = this.gamepad.buttons.some(b => b.pressed);
                this.isGamepadActive = stickMoved || buttonPressed;
            } else {
                this.gamepad = null;
                this.isGamepadActive = false;
            }
        }

        sendInput() {
            if (this.isLocalPlayerDead || !this.ws || this.ws.readyState !== WebSocket.OPEN) {
                return;
            }

            const input = {
                moveX: 0,
                moveY: 0,
                shooting: false,
                mouseX: 0,
                mouseY: 0,
                reload: false,
                weaponCycle: false
            };
            const deadzone = 0.25;

            if (this.isGamepadActive && this.gamepad) {
                // --- Gamepad Input (Analog) ---
                const leftStickX = this.gamepad.axes[0];
                const leftStickY = this.gamepad.axes[1];
                const rightStickX = this.gamepad.axes[2];
                const rightStickY = this.gamepad.axes[3];

                // Apply deadzone to movement stick
                if (Math.abs(leftStickX) > deadzone) input.moveX = leftStickX;
                if (Math.abs(leftStickY) > deadzone) input.moveY = leftStickY;

                // Clamp magnitude to a circle to ensure diagonal movement isn't faster
                const moveMagnitude = Math.sqrt(input.moveX * input.moveX + input.moveY * input.moveY);
                if (moveMagnitude > 1.0) {
                    input.moveX /= moveMagnitude;
                    input.moveY /= moveMagnitude;
                }

                input.shooting = this.gamepad.buttons[7] && this.gamepad.buttons[7].value > 0.5; // R2/RT
                input.reload = this.gamepad.buttons[2] && this.gamepad.buttons[2].pressed;

                const swapButtonPressed = this.gamepad.buttons[3] && this.gamepad.buttons[3].pressed;
                if (swapButtonPressed && !this.gamepadWeaponSwapPressed) {
                    input.weaponCycle = true;
                }
                this.gamepadWeaponSwapPressed = swapButtonPressed;

                const aimMagnitude = Math.sqrt(rightStickX * rightStickX + rightStickY * rightStickY);
                if (aimMagnitude > deadzone) {
                    this.gamepadAim.x = rightStickX / aimMagnitude;
                    this.gamepadAim.y = rightStickY / aimMagnitude;
                }

                const localPlayer = this.gameState.players.find(p => p.id === this.playerId);
                if (localPlayer) {
                    const playerCenterX = localPlayer.x + 10;
                    const playerCenterY = localPlayer.y + 10;
                    input.mouseX = playerCenterX + this.gamepadAim.x * 100;
                    input.mouseY = playerCenterY + this.gamepadAim.y * 100;
                }
            } else {
                // --- Keyboard & Mouse Input (Digital) ---
                let moveX = 0;
                let moveY = 0;
                if (this.keys['KeyW'] || this.keys['ArrowUp']) moveY = -1;
                if (this.keys['KeyS'] || this.keys['ArrowDown']) moveY = 1;
                if (this.keys['KeyA'] || this.keys['ArrowLeft']) moveX = -1;
                if (this.keys['KeyD'] || this.keys['ArrowRight']) moveX = 1;

                // For keyboard, normalize the vector to prevent faster diagonal movement.
                const magnitude = Math.sqrt(moveX * moveX + moveY * moveY);
                if (magnitude > 0) {
                    input.moveX = moveX / magnitude;
                    input.moveY = moveY / magnitude;
                }

                input.shooting = this.mouse.down;
                input.mouseX = this.mouse.x;
                input.mouseY = this.mouse.y;
                input.reload = !!this.keys['KeyR'];
            }
            this.ws.send(JSON.stringify(input));
        }

        sendConfigChange() {
            if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
                return;
            }
            const playerName = document.getElementById('playerNameInput').value;
            const weaponName = document.getElementById('weaponSelector').value;

            // Persist the player's name in their browser for future sessions
            localStorage.setItem('playerName', playerName);
            localStorage.setItem('weaponName', weaponName);

            const message = {
                type: 'configChange',
                playerName: playerName,
                weaponName: weaponName
            };
            this.ws.send(JSON.stringify(message));
            console.log(`Sent player config: Name=${playerName}, Weapon=${weaponName}`);
        }

        loadPlayerName() {
            const savedName = localStorage.getItem('playerName');
            if (savedName) {
                document.getElementById('playerNameInput').value = savedName;
            }
        }

        populateWeaponSelector(weaponNames) {
            const selector = document.getElementById('weaponSelector');
            if (!selector) return;

            // Clear existing options
            selector.innerHTML = '';

            // Add new options from the server data
            weaponNames.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                selector.appendChild(option);
            });

            // Now that the options exist, try to set the value from localStorage.
            const savedWeapon = localStorage.getItem('weaponName');
            if (savedWeapon && weaponNames.includes(savedWeapon)) {
                selector.value = savedWeapon;
            }

            // After populating, send the initial config to the server
            // to ensure client and server are in sync from the start.
            if (weaponNames.length > 0) {
                this.sendConfigChange();
            }
        }

        updateUI() {
            document.getElementById('playerCount').textContent = this.gameState.players ? this.gameState.players.length : 0;

            // --- Game Mode Specific UI Updates ---
            const gameInfo = this.gameState.info;
            if (gameInfo) {
                const gameModeElement = document.getElementById('gameModeDisplay');
                gameModeElement.textContent = gameInfo.type;

                // Default to showing respawn overlay, disable for specific modes
                this.shouldDrawRespawnOverlay = true;

                // Update round timer display
                if (gameInfo.roundTimeRemainingSeconds !== undefined) {
                    const timerElement = document.getElementById('roundTimer');
                    const totalSeconds = gameInfo.roundTimeRemainingSeconds;
                    const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
                    const seconds = (totalSeconds % 60).toString().padStart(2, '0');
                    timerElement.textContent = `${minutes}:${seconds}`;
                }

                const team1ScoreEl = document.getElementById('team1Score');
                const team2ScoreEl = document.getElementById('team2Score');

                // --- Game Mode Specific UI ---
                switch (gameInfo.type) {
                    case 'Zombie Defense':
                        this.shouldDrawRespawnOverlay = false;
                        team1ScoreEl.innerHTML = `Wave: <span style="color: #FFC107;">${gameInfo.waveNumber}</span>`;
                        team2ScoreEl.innerHTML = `Zombies: <span style="color: #FFC107;">${gameInfo.zombiesAlive}</span>`;
                        break;
                    case 'Elimination':
                        this.shouldDrawRespawnOverlay = false;
                    default:
                        // Default handling for TDM, KOTH, CTF, Oddball etc.
                        team1ScoreEl.textContent = `${Math.floor(gameInfo.team1Score)}`;
                        team2ScoreEl.textContent = `${Math.floor(gameInfo.team2Score)}`;
                        break;
                }
            }

            // Update local player info
            if (this.playerId) {
                const localPlayer = this.gameState.players.find(p => p.id === this.playerId);
                if (localPlayer) {
                    this.isLocalPlayerDead = localPlayer.dead;
                    // Update the current weapon display and sync the dropdown
                    if (localPlayer.weapon) {
                        document.getElementById('weaponSelector').value = localPlayer.weapon.name;
                    }
                } else {
                    this.isLocalPlayerDead = false;
                }
            }

            // --- Update Sidebar Scoreboard ---
            const now = Date.now();
            if (now - this.lastScoreboardUpdateTime > this.SCOREBOARD_UPDATE_INTERVAL) {
                this.updateSidebarScoreboard();
                this.lastScoreboardUpdateTime = now;
            }
         }

        updateSidebarScoreboard() {
            const team1List = document.getElementById('team1-players');
            const team2List = document.getElementById('team2-players');
            if (!team1List || !team2List) return;

            // Clear previous entries
            team1List.innerHTML = '';
            team2List.innerHTML = '';

            const players = this.gameState.players;

            // Sort players by kills (descending)
            const team1Players = players.filter(p => p.team === 1).sort((a, b) => b.kills - a.kills);
            const team2Players = players.filter(p => p.team === 2).sort((a, b) => b.kills - a.kills);

            const createPlayerEntry = (player) => {
                const entry = document.createElement('li');
                entry.className = 'scoreboard-player';
                if (player.id === this.playerId) {
                    entry.classList.add('local-player-highlight');
                }

                const nameSpan = document.createElement('span');
                nameSpan.className = 'player-name';
                nameSpan.textContent = player.playerName || (player.id.startsWith('ai-') ? `AI` : 'Player');
                nameSpan.title = player.playerName || player.id; // Tooltip for long names

                const scoreSpan = document.createElement('span');
                scoreSpan.className = 'player-score';
                scoreSpan.textContent = `${player.kills} / ${player.deaths}`;

                entry.appendChild(nameSpan);
                entry.appendChild(scoreSpan);
                return entry;
            };

            team1Players.forEach(p => team1List.appendChild(createPlayerEntry(p)));
            team2Players.forEach(p => team2List.appendChild(createPlayerEntry(p)));
        }

        // Add this new method to the Game class
        preRenderBackground() {
            const bCtx = this.backgroundCtx;
            bCtx.fillStyle = '#333';
            bCtx.fillRect(0, 0, this.backgroundCanvas.width, this.backgroundCanvas.height);

            // Render hazards
            if (this.gameState.hazards) {
                this.gameState.hazards.forEach(hazard => {
                    if (hazard.type === 'SLOW') {
                        this.drawSandPit(bCtx, hazard);
                    } else if (hazard.type === 'DAMAGE') {
                        this.drawFirePit(bCtx, hazard);
                    }
                });
            }

            // Draw a center line to divide the field
            bCtx.save();
            bCtx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            bCtx.lineWidth = 2;
            bCtx.setLineDash([15, 15]);
            bCtx.beginPath();
            bCtx.moveTo(this.backgroundCanvas.width / 2, 0);
            bCtx.lineTo(this.backgroundCanvas.width / 2, this.backgroundCanvas.height);
            bCtx.stroke();
            bCtx.restore();

            // Render obstacles
            if (this.gameState.obstacles) {
                this.gameState.obstacles.forEach(obstacle => {
                    if (!obstacle.vertices || obstacle.vertices.length < 3) {
                       return;
                    }
                    bCtx.save();
                    // By setting lineJoin to 'round' and using a thick stroke before filling,
                    // we can create obstacles with smooth, rounded corners.
                    const cornerRadius = 7; // The radius of the smoothed corners.
                    bCtx.lineJoin = 'round';
                    // The lineWidth needs to be twice the desired radius because the stroke
                    // extends on both sides of the path.
                    bCtx.lineWidth = cornerRadius * 2;
                    bCtx.fillStyle = '#888'; // Color for the main body of the obstacle
                    bCtx.strokeStyle = '#888'; // The stroke creates the rounded corners

                    bCtx.beginPath();
                    bCtx.moveTo(obstacle.vertices[0].x, obstacle.vertices[0].y);
                    for (let i = 1; i < obstacle.vertices.length; i++) {
                        bCtx.lineTo(obstacle.vertices[i].x, obstacle.vertices[i].y);
                    }
                    bCtx.closePath();
                    bCtx.stroke(); // This is what creates the rounded effect
                    bCtx.fill();   // This fills in the shape
                    bCtx.restore();
                });
            }
            console.log("Pre-rendered static background.");
        }


        render() {
            // If the background needs to be redrawn (e.g., new game), do it once.
            if (this.backgroundNeedsRedraw && this.gameState.obstacles && this.gameState.obstacles.length > 0) {
                this.preRenderBackground();
                this.backgroundNeedsRedraw = false;
            }

            // Clear canvas
            this.ctx.drawImage(this.backgroundCanvas, 0, 0);

            if (this.gameState.deathMarkers) {
                this.ctx.strokeStyle = 'rgba(200, 0, 0, 0.6)'; // Semi-transparent red
                this.ctx.lineWidth = 3;
                const markerSize = 10; // The size of the 'X'

                this.gameState.deathMarkers.forEach(marker => {
                    // Draw the first line of the 'X' (\)
                    this.ctx.beginPath();
                    this.ctx.moveTo(marker.x - markerSize, marker.y - markerSize);
                    this.ctx.lineTo(marker.x + markerSize, marker.y + markerSize);
                    this.ctx.stroke();

                    // Draw the second line of the 'X' (/)
                    this.ctx.beginPath();
                    this.ctx.moveTo(marker.x + markerSize, marker.y - markerSize);
                    this.ctx.lineTo(marker.x - markerSize, marker.y + markerSize);
                    this.ctx.stroke();
                });
            }

            // Draw players
            this.gameState.players.forEach(player => {
                this.drawPlayer(player);
            });

            // Draw bullets
            if (this.gameState.bullets) {
                this.gameState.bullets.forEach(bullet => {
                    this.ctx.fillStyle = bullet.team === 1 ? '#81C784' : '#E57373';
                    this.ctx.beginPath();
                    this.ctx.arc(bullet.x, bullet.y, 3, 0, 2 * Math.PI);
                    this.ctx.fill();
                });
            }

            // Draw crosshair at mouse position
            // Only show the crosshair if a gamepad is not active
            if (!this.isGamepadActive && this.mouse.x && this.mouse.y) {
                this.ctx.strokeStyle = '#fff';
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                this.ctx.moveTo(this.mouse.x - 10, this.mouse.y);
                this.ctx.lineTo(this.mouse.x + 10, this.mouse.y);
                this.ctx.moveTo(this.mouse.x, this.mouse.y - 10);
                this.ctx.lineTo(this.mouse.x, this.mouse.y + 10);
                this.ctx.stroke();
            }

            // Draw respawn overlay if the local player is dead
            if (this.isLocalPlayerDead && this.shouldDrawRespawnOverlay) {
                const localPlayer = this.gameState.players.find(p => p.id === this.playerId);
                if (localPlayer && localPlayer.respawnTime) {
                    const remainingTime = Math.max(0, (localPlayer.respawnTime - Date.now()) / 1000);
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    this.ctx.fillStyle = 'white';
                    this.ctx.font = '48px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillText(`Respawning in ${remainingTime.toFixed(1)}s`, this.canvas.width / 2, this.canvas.height / 2);
                }
            }

            this.drawHill();
            this.drawFlags();
            this.drawOddball();
            this.drawGameEvents();
        }

        drawHill() {
            const gameInfo = this.gameState.info;
            if (!gameInfo || !gameInfo.hill) {
                return;
            }

            const hill = gameInfo.hill;
            const pos = hill.position;
            const radius = hill.radius;

            this.ctx.save();
            this.ctx.globalAlpha = 0.25; // Make the hill semi-transparent

            // Set color based on state
            if (hill.contested) {
                this.ctx.fillStyle = '#FFC107'; // Yellow for contested
            } else if (hill.controllingTeam === 1) {
                this.ctx.fillStyle = '#81C784'; // Light Green for team 1
            } else if (hill.controllingTeam === 2) {
                this.ctx.fillStyle = '#F44336'; // Red for team 2
            } else {
                this.ctx.fillStyle = '#9E9E9E'; // Gray for neutral
            }

            // Draw the hill circle
            this.ctx.beginPath();
            this.ctx.arc(pos.x, pos.y, radius, 0, 2 * Math.PI);
            this.ctx.fill();

            // Draw a border to make it more visible
            this.ctx.globalAlpha = 0.8;
            this.ctx.lineWidth = 3;
            this.ctx.strokeStyle = this.ctx.fillStyle; // Use same color but more opaque
            this.ctx.stroke();

            // --- Draw the flag in the center ---
            this.ctx.globalAlpha = 1.0; // Make the flag fully opaque

            // Draw flagpole
            this.ctx.strokeStyle = '#616161'; // Dark grey for the pole
            this.ctx.lineWidth = 3;
            this.ctx.beginPath();
            this.ctx.moveTo(pos.x, pos.y + 15);
            this.ctx.lineTo(pos.x, pos.y - 25);
            this.ctx.stroke();

            // Draw the flag cloth (triangle)
            // The color is already set in strokeStyle from the border drawing
            this.ctx.fillStyle = this.ctx.strokeStyle;
            this.ctx.beginPath();
            this.ctx.moveTo(pos.x + 2, pos.y - 25); // Top of the pole, slightly offset
            this.ctx.lineTo(pos.x + 22, pos.y - 18); // Outer point
            this.ctx.lineTo(pos.x + 2, pos.y - 11); // Bottom of the flag
            this.ctx.closePath();
            this.ctx.fill();

            this.ctx.restore();
        }

        drawFlags() {
            const gameInfo = this.gameState.info;
            if (!gameInfo || gameInfo.type !== 'Capture the Flag') {
                return;
            }

            if (gameInfo.team1Flag) {
                this.drawSingleFlag(gameInfo.team1Flag);
            }
            if (gameInfo.team2Flag) {
                this.drawSingleFlag(gameInfo.team2Flag);
            }
        }

        drawOddball() {
            const gameInfo = this.gameState.info;
            if (!gameInfo || gameInfo.type !== 'Oddball' || !gameInfo.oddball) {
                return;
            }

            const oddball = gameInfo.oddball;

            // The ball is carried, so it will be drawn on the player, not here.
            if (oddball.state === 'CARRIED') {
                return;
            }

            const pos = oddball.position;
            this.ctx.save();

            // Draw a glowing, pulsating effect for the ball
            const pulse = Math.abs(Math.sin(Date.now() / 200));
            this.ctx.fillStyle = '#FFD700'; // Gold color
            this.ctx.strokeStyle = 'white';
            this.ctx.lineWidth = 2 + pulse * 2;
            this.ctx.globalAlpha = 0.7 + pulse * 0.3;

            // Draw the main ball
            this.ctx.beginPath();
            this.ctx.arc(pos.x, pos.y, 12, 0, 2 * Math.PI);
            this.ctx.fill();
            this.ctx.stroke();

            // Draw some "spikes" to make it look like a skull or spiky ball
            this.ctx.lineWidth = 3;
            this.ctx.strokeStyle = '#FFA000'; // Orange
            for (let i = 0; i < 6; i++) {
                const angle = (i * Math.PI / 3) + (Date.now() / 1000); // Rotate spikes
                this.ctx.beginPath();
                this.ctx.moveTo(pos.x, pos.y);
                this.ctx.lineTo(
                    pos.x + Math.cos(angle) * 20,
                    pos.y + Math.sin(angle) * 20
                );
                this.ctx.stroke();
            }

            this.ctx.restore();
        }

        drawSingleFlag(flag) {
            // Carried flags are drawn as an icon on the player, not here.
            if (flag.state === 'CARRIED') {
                return;
            }

            const pos = flag.position;
            const basePos = flag.basePosition;
            const teamColor = flag.team === 1 ? '#4CAF50' : '#F44336';

            this.ctx.save();

            // Draw the base stand if the flag is at its home base
            if (flag.state === 'AT_BASE') {
                this.ctx.fillStyle = '#444';
                this.ctx.strokeStyle = '#666';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.rect(basePos.x - 10, basePos.y - 10, 20, 20);
                this.ctx.fill();
                this.ctx.stroke();
            }

            // Draw a pulsating circle for dropped flags to attract attention
            if (flag.state === 'DROPPED') {
                const pulse = Math.abs(Math.sin(Date.now() / 300)); // Pulsates
                this.ctx.strokeStyle = teamColor;
                this.ctx.lineWidth = 2 + pulse * 2;
                this.ctx.globalAlpha = 0.5 + pulse * 0.4;
                this.ctx.beginPath();
                this.ctx.arc(pos.x, pos.y, 15 + pulse * 5, 0, 2 * Math.PI);
                this.ctx.stroke();
            }

            // --- Draw the flag model (pole and cloth) ---
            this.ctx.globalAlpha = 1.0;

            // Draw flagpole
            this.ctx.strokeStyle = '#616161';
            this.ctx.lineWidth = 4;
            this.ctx.beginPath();
            this.ctx.moveTo(pos.x, pos.y + 15);
            this.ctx.lineTo(pos.x, pos.y - 25);
            this.ctx.stroke();

            // Draw the flag cloth
            this.ctx.fillStyle = teamColor;
            this.ctx.beginPath();
            this.ctx.moveTo(pos.x + 2, pos.y - 25); // Top of the pole
            this.ctx.lineTo(pos.x + 25, pos.y - 15); // Outer point
            this.ctx.lineTo(pos.x + 2, pos.y - 5);  // Bottom of the flag
            this.ctx.closePath();
            this.ctx.fill();

            this.ctx.restore();
        }

        drawSandPit(bCtx, hazard) {
            const pos = hazard.position;
            const baseRadius = hazard.radius;
            bCtx.save();

            // --- Create and fill the ragged, natural-looking path ---
            bCtx.beginPath();
            const segments = 40; // More segments for a more detailed edge
            const angleStep = (2 * Math.PI) / segments;
            const radiusVariation = baseRadius * 0.12; // The edge will vary by +/- 12% of the radius

            // Move to the first point on our custom path
            for (let i = 0; i <= segments; i++) {
                const angle = i * angleStep;

                // Combine a sine wave with random noise for a more organic shape
                const waveOffset = Math.sin(angle * 6) * radiusVariation * 0.6;
                const randomOffset = (Math.random() - 0.5) * 2 * radiusVariation * 0.4;
                const currentRadius = baseRadius + waveOffset + randomOffset;

                const x = pos.x + Math.cos(angle) * currentRadius;
                const y = pos.y + Math.sin(angle) * currentRadius;

                if (i === 0) {
                    bCtx.moveTo(x, y);
                } else {
                    bCtx.lineTo(x, y);
                }
            }
            bCtx.closePath(); // Close the path back to the first point

            bCtx.fillStyle = '#A0785A'; // A sandy color
            bCtx.fill();

            // --- Add texture with darker specks ---
            bCtx.fillStyle = 'rgba(90, 60, 40, 0.15)'; // Darker, browner speckles
            const speckleCount = Math.floor(baseRadius * 1.4);

            for (let i = 0; i < speckleCount; i++) {
                // Get a random point within the circle, using the base radius for distribution.
                // This is an approximation, but it's fast and looks good enough.
                const angle = Math.random() * 2 * Math.PI;
                const r = Math.random() * baseRadius * 0.9; // *0.9 to keep speckles from the very edge
                const speckleX = pos.x + Math.cos(angle) * r;
                const speckleY = pos.y + Math.sin(angle) * r;

                bCtx.beginPath();
                bCtx.arc(speckleX, speckleY, Math.random() * 1.3 + 1, 0, 2 * Math.PI);
                bCtx.fill();
            }
            bCtx.restore();
        }

        drawFirePit(bCtx, hazard) {
            const pos = hazard.position;
            const radius = hazard.radius;
            bCtx.save();

            // Create a radial gradient for a glowing effect from the center outwards
            const gradient = bCtx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, radius);
            gradient.addColorStop(0, 'rgba(255, 235, 59, 0.9)');  // Bright yellow center (hottest)
            gradient.addColorStop(0.6, 'rgba(255, 87, 34, 0.8)'); // Deep orange middle
            gradient.addColorStop(1, 'rgba(198, 40, 40, 0.6)');   // Dark red edge (cooler)

            bCtx.fillStyle = gradient;
            bCtx.beginPath();
            bCtx.arc(pos.x, pos.y, radius, 0, 2 * Math.PI);
            bCtx.fill();

            // Add some dark "cracks" to look like cooling rock or embers
            bCtx.strokeStyle = 'rgba(40, 20, 10, 0.4)';
            bCtx.lineWidth = 2;
            const crackCount = Math.floor(radius / 8);
            for (let i = 0; i < crackCount; i++) {
                const startAngle = Math.random() * 2 * Math.PI;
                const endAngle = startAngle + (Math.random() - 0.5) * 0.8;
                const crackRadius = Math.random() * radius * 0.9;
                bCtx.beginPath();
                bCtx.arc(pos.x, pos.y, crackRadius, startAngle, endAngle);
                bCtx.stroke();
            }

            bCtx.restore();
        }

        drawGameEvents() {
            if (!this.gameState.events || this.gameState.events.length === 0) {
                return;
            }

            this.ctx.save();
            this.ctx.textAlign = 'center';
            this.ctx.font = 'bold 18px Arial';
            this.ctx.shadowColor = 'black';
            this.ctx.shadowBlur = 5;

            // Draw events from the bottom up, near the top of the screen
            const startY = 50;
            this.gameState.events.forEach((event, index) => {
                const yPos = startY + (index * 25);
                switch (event.type) {
                    case 'FLAG_CAPTURE': this.ctx.fillStyle = '#FFD700'; break; // Gold
                    case 'FLAG_PICKUP':  this.ctx.fillStyle = '#4FC3F7'; break; // Light Blue
                    case 'FLAG_DROP':    this.ctx.fillStyle = '#BDBDBD'; break; // Grey
                    case 'FLAG_RETURN':  this.ctx.fillStyle = '#81C784'; break; // Light Green
                    case 'GREEN':  this.ctx.fillStyle = '#81C784'; break;
                    case 'RED':  this.ctx.fillStyle = '#F44336'; break;
                    case 'YELLOW': this.ctx.fillStyle = '#FFD700'; break;
                    case 'BLUE': this.ctx.fillStyle = '#4FC3F7'; break;
                    default: this.ctx.fillStyle = '#FFFFFF'; break;
                }
                this.ctx.fillText(event.message, this.canvas.width / 2, yPos);
            });

            this.ctx.restore();
        }

        drawPlayer(player) {
            if (player.dead) {
                return;
            }

            const playerSize = 20;
            const playerCenterX = player.x + playerSize / 2;
            const playerCenterY = player.y + playerSize / 2;

            // Draw player body (circle)
            this.ctx.fillStyle = player.team === 1 ? '#4CAF50' : '#F44336';
            this.ctx.strokeStyle = player.id === this.playerId ? '#FFD700' : (player.team === 1 ? '#388E3C' : '#B71C1C');
            this.ctx.lineWidth = player.id === this.playerId ? 3 : 2;
            this.ctx.beginPath();
            this.ctx.arc(playerCenterX, playerCenterY, playerSize / 2, 0, 2 * Math.PI);
            this.ctx.fill();
            this.ctx.stroke();

            // Draw the turret, rotated to face the aim direction
            this.ctx.save();
            this.ctx.translate(playerCenterX, playerCenterY);

            let angle = 0;
            if (player.id === this.playerId) {
                if (this.isGamepadActive) {
                    angle = Math.atan2(this.gamepadAim.y, this.gamepadAim.x);
                } else {
                    angle = Math.atan2(this.mouse.y - playerCenterY, this.mouse.x - playerCenterX);
                }
            } else {
                angle = player.lastBulletAngle || 0;
            }
            this.ctx.rotate(angle);

            // Draw the turret barrel
            this.ctx.fillStyle = '#9E9E9E';
            this.ctx.strokeStyle = '#616161';
            this.ctx.lineWidth = 1;
            this.ctx.fillRect(0, -3, 15, 6);
            this.ctx.strokeRect(0, -3, 15, 6);
            this.ctx.restore();

            // --- Check if this player is carrying a flag ---
            const gameInfo = this.gameState.info;
            if (gameInfo && gameInfo.type === 'Capture the Flag') {
                const enemyFlag = player.team === 1 ? gameInfo.team2Flag : gameInfo.team1Flag;
                if (enemyFlag && enemyFlag.state === 'CARRIED' && enemyFlag.carrierId === player.id) {
                    // This player is the flag carrier. Draw a flag icon above them.
                    const flagColor = player.team === 1 ? '#F44336' : '#4CAF50'; // The *enemy* flag color
                    this.ctx.save();
                    this.ctx.translate(playerCenterX, player.y - 35); // Position above the name/health bar

                    // Draw a small flag
                    this.ctx.strokeStyle = '#333';
                    this.ctx.lineWidth = 1;
                    this.ctx.fillStyle = flagColor;
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, 0);
                    this.ctx.lineTo(12, -6);
                    this.ctx.lineTo(0, -12);
                    this.ctx.closePath();
                    this.ctx.fill();
                    this.ctx.stroke();

                    this.ctx.restore();
                }
            }

            if (gameInfo && gameInfo.type === 'Oddball' && gameInfo.oddball) {
                const oddball = gameInfo.oddball;
                if (oddball.state === 'CARRIED' && oddball.carrierId === player.id) {
                    // This player is the ball carrier. Draw an icon.
                    this.ctx.save();
                    this.ctx.translate(playerCenterX, player.y - 35); // Position above name

                    this.ctx.fillStyle = '#FFD700';
                    this.ctx.strokeStyle = 'white';
                    this.ctx.lineWidth = 1;
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, 8, 0, 2 * Math.PI); // Draw a small ball icon
                    this.ctx.fill();
                    this.ctx.stroke();

                    this.ctx.restore();
                }
            }

            if (gameInfo && gameInfo.type === 'Juggernaut'
                    && (gameInfo.team1Juggernaut === player.id || gameInfo.team2Juggernaut == player.id)) {
                this.ctx.save();
                this.ctx.font = '24px Arial';
                this.ctx.textAlign = 'center';
                // Position the crown above the player's name and health bar
                this.ctx.fillText('👑', playerCenterX, player.y - 30);
                this.ctx.restore();
            }

            // --- Draw text and health bar above player ---
            this.ctx.fillStyle = '#fff';
            this.ctx.font = '12px Arial';
            this.ctx.textAlign = 'center';
            const baseName = player.playerName || (player.id.startsWith('ai-') ? 'AI' : 'Player');
            const displayName = `${baseName} | ${player.weapon.shortName}`;
            this.ctx.fillText(displayName, playerCenterX, player.y - 15);

            // --- Draw ammo count or reload indicator inside the local player's box ---
            if (player.id === this.playerId) {
                this.ctx.font = 'bold 12px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle'; // Center the text vertically

                // Add a dark shadow for readability against any team color
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                const text = player.reloading ? 'R' : player.currentAmmoInMagazine.toString();
                this.ctx.fillText(text, playerCenterX + 1, playerCenterY + 1);

                // Draw the main text
                this.ctx.fillStyle = player.reloading ? '#FFC107' : '#FFFFFF'; // Yellow for 'R', white for ammo
                this.ctx.fillText(text, playerCenterX, playerCenterY);

                // Reset baseline for other text
                this.ctx.textBaseline = 'alphabetic';
            }

            // --- Draw Health Arc around the player ---
            const maxHealth = player.maxHealth || 100;
            const healthPercentage = Math.max(0, player.currentHealth / maxHealth);
            const healthBarRadius = playerSize / 2 + 4; // Position it just outside the player circle
            const healthBarThickness = 3;

            // Define the geometry of the arc above the player
            const arcSpan = Math.PI / 2; // A 90-degree quarter arc
            const startAngle = -Math.PI / 2 - (arcSpan / 2); // Center it at the top. (Starts at 10:30 on a clock)
            const endAngle = startAngle + arcSpan;           // Ends at 1:30 on a clock.

            // Draw the background of the health arc (the empty part)
            this.ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
            this.ctx.lineWidth = healthBarThickness + 1; // A bit thicker to create a border effect
            this.ctx.beginPath();
            this.ctx.arc(playerCenterX, playerCenterY, healthBarRadius, startAngle, endAngle);
            this.ctx.stroke();

            // Draw the actual health part of the arc
            if (healthPercentage > 0) {
                const healthEndAngle = startAngle + (healthPercentage * arcSpan);
                this.ctx.strokeStyle = healthPercentage > 0.5 ? '#4CAF50' : (healthPercentage > 0.2 ? '#FFC107' : '#F44336');
                this.ctx.lineWidth = healthBarThickness;
                this.ctx.beginPath();
                this.ctx.arc(playerCenterX, playerCenterY, healthBarRadius, startAngle, healthEndAngle);
                this.ctx.stroke();
            }
        }

        startGameLoop() {
            setInterval(() => this.sendInput(), 50);
            const renderLoop = () => {
                this.pollGamepad(); // Check for controller input every frame
                this.render();
                requestAnimationFrame(renderLoop);
            };
            renderLoop();
        }
    }

    window.addEventListener('load', () => {
        new Game();
    });
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Full Steam Game Lobby</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600&display=swap');
        
        :root {
            --primary-bg: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0f0f23 100%);
            --card-bg: rgba(42, 42, 60, 0.9);
            --card-border: rgba(100, 200, 255, 0.3);
            --accent-blue: #64c8ff;
            --accent-green: #4ade80;
            --accent-purple: #a855f7;
            --accent-orange: #fb923c;
            --text-primary: #ffffff;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --shadow-glow: 0 0 20px rgba(100, 200, 255, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--primary-bg);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: 'Exo 2', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 200, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        #lobby-wrapper {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(100, 200, 255, 0.5);
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            font-size: 1.1em;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-weight: 300;
        }

        h2 {
            text-align: center;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1.8em;
            margin: 40px 0 25px 0;
            color: var(--accent-blue);
            position: relative;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
        }

        #stats-bar {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-glow);
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 600;
            color: var(--accent-green);
            display: block;
            font-family: 'Orbitron', monospace;
        }

        .stat-label {
            font-size: 0.9em;
            color: var(--text-muted);
            margin-top: 5px;
        }

        #games-list {
            list-style: none;
            padding: 0;
            display: grid;
            gap: 15px;
        }

        .game-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .game-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple), var(--accent-green));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .game-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(100, 200, 255, 0.3);
            border-color: var(--accent-blue);
        }

        .game-item:hover::before {
            opacity: 1;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .game-type {
            font-size: 1.4em;
            font-weight: 600;
            color: var(--accent-blue);
            font-family: 'Orbitron', monospace;
        }

        .game-status {
            background: var(--accent-green);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 500;
        }

        .game-status.full {
            background: var(--accent-orange);
        }

        .game-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-icon {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }

        .info-label {
            font-size: 0.9em;
            color: var(--text-muted);
        }

        .info-value {
            font-weight: 500;
            color: var(--text-secondary);
        }

        .game-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .join-button, #create-buttons button {
            background: linear-gradient(45deg, var(--accent-green), #22c55e);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1em;
            font-weight: 500;
            border-radius: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-family: 'Exo 2', sans-serif;
        }

        .join-button::before, #create-buttons button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transition: all 0.3s ease;
            transform: translate(-50%, -50%);
        }

        .join-button:hover::before, #create-buttons button:hover::before {
            width: 300px;
            height: 300px;
        }

        .join-button:hover, #create-buttons button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4);
        }

        .spectate-button {
            background: linear-gradient(45deg, var(--accent-purple), #9333ea);
        }

        .spectate-button:hover {
            box-shadow: 0 5px 15px rgba(168, 85, 247, 0.4);
        }

        .join-button:disabled {
            background: #6b7280;
            cursor: not-allowed;
            transform: none;
        }

        .join-button:disabled:hover {
            box-shadow: none;
        }

        #create-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        #create-buttons button {
            background: linear-gradient(45deg, var(--accent-blue), #0ea5e9);
            padding: 15px 25px;
            font-size: 1.1em;
            font-weight: 600;
        }

        #create-buttons button:hover {
            box-shadow: 0 5px 15px rgba(100, 200, 255, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            background: var(--card-bg);
            border: 1px dashed var(--card-border);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--card-border);
            border-top: 2px solid var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .player-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .player-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
        }

        .player-dot.full {
            background: var(--accent-orange);
        }

        @media (max-width: 768px) {
            #lobby-wrapper {
                padding: 20px 15px;
            }
            
            h1 {
                font-size: 2.2em;
            }
            
            #stats-bar {
                flex-direction: column;
                gap: 15px;
            }
            
            .game-header {
                flex-direction: column;
                gap: 10px;
            }
            
            .game-info {
                grid-template-columns: 1fr;
            }
            
            .game-actions {
                justify-content: stretch;
            }
            
            .join-button, .spectate-button {
                flex: 1;
            }
        }
    </style>
</head>
<body>
<div id="lobby-wrapper">
    <h1>Full Steam</h1>
    <div class="subtitle">Multiplayer Gaming Platform</div>

    <div id="stats-bar">
        <div class="stat-item">
            <span class="stat-value" id="player-count-value">0</span>
            <div class="stat-label">Players Online</div>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="games-count-value">0</span>
            <div class="stat-label">Active Games</div>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="server-status">🟢</span>
            <div class="stat-label">Server Status</div>
        </div>
    </div>

    <h2>Create New Game</h2>
    <div id="create-buttons">
        <div class="loading">Loading game types...</div>
    </div>

    <h2>Join Active Games</h2>
    <ul id="games-list">
        <li class="loading">Loading games...</li>
    </ul>
</div>

<script type="text/javascript">
    const gamesList = document.getElementById('games-list');
    const createButtons = document.getElementById('create-buttons');
    const playerCountValue = document.getElementById('player-count-value');
    const gamesCountValue = document.getElementById('games-count-value');
    const serverStatus = document.getElementById('server-status');

    let lastUpdateTime = Date.now();

    function fetchLobbyInfo() {
        fetch('/api/games')
            .then(response => response.json())
            .then(lobbyInfo => {
                updateLobby(lobbyInfo);
                updateServerStatus(true);
                lastUpdateTime = Date.now();
            })
            .catch(error => {
                console.error('Error fetching lobby info:', error);
                updateServerStatus(false);
                showErrorState();
            });
    }

    function updateServerStatus(isOnline) {
        if (isOnline) {
            serverStatus.textContent = '🟢';
            serverStatus.parentElement.querySelector('.stat-label').textContent = 'Server Online';
        } else {
            serverStatus.textContent = '🔴';
            serverStatus.parentElement.querySelector('.stat-label').textContent = 'Server Offline';
        }
    }

    function showErrorState() {
        gamesList.innerHTML = `
            <li class="empty-state">
                <div class="empty-state-icon">⚠️</div>
                <div><strong>Connection Error</strong></div>
                <div>Unable to connect to game server. Please check your connection and try again.</div>
            </li>
        `;
        createButtons.innerHTML = `
            <div class="empty-state" style="margin: 0;">
                <div>Game creation unavailable</div>
            </div>
        `;
    }

    function updateLobby(lobbyInfo) {
        // Update stats bar
        playerCountValue.textContent = lobbyInfo.globalPlayerCount || 0;
        gamesCountValue.textContent = lobbyInfo.activeGames ? lobbyInfo.activeGames.length : 0;

        // Update "Create Game" buttons
        createButtons.innerHTML = '';
        if (lobbyInfo.gameTypes && lobbyInfo.gameTypes.length > 0) {
            lobbyInfo.gameTypes.forEach(gameType => {
                const button = document.createElement('button');
                button.textContent = `Create ${gameType} Game`;
                button.onclick = () => createGame(gameType);
                createButtons.appendChild(button);
            });
        } else {
            createButtons.innerHTML = `
                <div class="empty-state" style="margin: 0;">
                    <div>No game types available</div>
                </div>
            `;
        }

        // Update active games list
        gamesList.innerHTML = '';
        if (lobbyInfo.activeGames && lobbyInfo.activeGames.length > 0) {
            lobbyInfo.activeGames.forEach(game => {
                const listItem = document.createElement('li');
                listItem.className = 'game-item';

                const isFull = game.playerCount >= game.maxPlayers;
                const gameAge = getGameAge(game.createdTime);
                const playerPercentage = Math.round((game.playerCount / game.maxPlayers) * 100);

                listItem.innerHTML = `
                    <div class="game-header">
                        <div class="game-type">${game.gameType}</div>
                        <div class="game-status ${isFull ? 'full' : ''}">${isFull ? 'Full' : 'Open'}</div>
                    </div>
                    <div class="game-info">
                        <div class="info-item">
                            <span class="info-icon">👥</span>
                            <div>
                                <span class="info-label">Players:</span>
                                <span class="info-value player-indicator">
                                    <span class="player-dot ${isFull ? 'full' : ''}"></span>
                                    ${game.playerCount}/${game.maxPlayers} (${playerPercentage}%)
                                </span>
                            </div>
                        </div>
                        <div class="info-item">
                            <span class="info-icon">🎮</span>
                            <div>
                                <span class="info-label">Game ID:</span>
                                <span class="info-value">${game.gameId}</span>
                            </div>
                        </div>
                        <div class="info-item">
                            <span class="info-icon">⏱️</span>
                            <div>
                                <span class="info-label">Duration:</span>
                                <span class="info-value">${gameAge}</span>
                            </div>
                        </div>
                        <div class="info-item">
                            <span class="info-icon">📊</span>
                            <div>
                                <span class="info-label">Status:</span>
                                <span class="info-value">${game.gameState || 'Active'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="game-actions">
                        ${!isFull ? `<button class="join-button" onclick="joinGame('${game.gameId}', '${game.gameType}')">🎯 Join Game</button>` : 
                          `<button class="join-button" disabled>Game Full</button>`}
                        <button class="join-button spectate-button" onclick="spectateGame('${game.gameId}')">👁️ Spectate</button>
                    </div>
                `;
                gamesList.appendChild(listItem);
            });
        } else {
            gamesList.innerHTML = `
                <li class="empty-state">
                    <div class="empty-state-icon">🎮</div>
                    <div><strong>No Active Games</strong></div>
                    <div>Be the first to create a game! Click one of the "Create Game" buttons above.</div>
                </li>
            `;
        }
    }

    function getGameAge(createdTime) {
        if (!createdTime) return 'Unknown';
        
        const now = Date.now();
        const created = typeof createdTime === 'string' ? new Date(createdTime).getTime() : createdTime;
        const diffMinutes = Math.floor((now - created) / (1000 * 60));
        
        if (diffMinutes < 1) return 'Just now';
        if (diffMinutes < 60) return `${diffMinutes}m ago`;
        
        const diffHours = Math.floor(diffMinutes / 60);
        if (diffHours < 24) return `${diffHours}h ${diffMinutes % 60}m ago`;
        
        const diffDays = Math.floor(diffHours / 24);
        return `${diffDays}d ${diffHours % 24}h ago`;
    }

    function joinGame(gameId, gameType) {
        // Add visual feedback
        const button = event.target;
        const originalText = button.textContent;
        button.textContent = 'Joining...';
        button.disabled = true;
        
        setTimeout(() => {
            window.location.href = `/game.html?gameId=${gameId}&gameType=${gameType}`;
        }, 500);
    }

    function createGame(gameType) {
        // Add visual feedback
        const button = event.target;
        const originalText = button.textContent;
        button.textContent = 'Creating...';
        button.disabled = true;
        
        setTimeout(() => {
            window.location.href = `/game.html?gameType=${gameType}`;
        }, 500);
    }

    function spectateGame(gameId) {
        // Add visual feedback
        const button = event.target;
        const originalText = button.textContent;
        button.textContent = 'Connecting...';
        button.disabled = true;
        
        setTimeout(() => {
            window.location.href = `/game.html?spectate=true&gameId=${gameId}`;
        }, 500);
    }

    // Add connection status monitoring
    function checkConnectionHealth() {
        const timeSinceLastUpdate = Date.now() - lastUpdateTime;
        if (timeSinceLastUpdate > 10000) { // 10 seconds without update
            updateServerStatus(false);
        }
    }

    // Add keyboard shortcuts
    document.addEventListener('keydown', function(event) {
        if (event.key === 'F5' || (event.ctrlKey && event.key === 'r')) {
            event.preventDefault();
            fetchLobbyInfo();
        }
    });

    // Initialize page
    fetchLobbyInfo();
    
    // Refresh every 3 seconds for better responsiveness
    setInterval(fetchLobbyInfo, 3000);
    
    // Check connection health every 5 seconds
    setInterval(checkConnectionHealth, 5000);

    // Add page visibility API support for better performance
    document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
            fetchLobbyInfo(); // Refresh when user comes back to tab
        }
    });
</script>
</body>
</html>

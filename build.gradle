plugins {
    id 'java'
    id 'io.micronaut.application' version '4.4.2'
    id("com.gradleup.shadow") version "8.3.8"
    id 'org.graalvm.buildtools.native' version '0.11.0'
}

group = 'com.fullsteam'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

micronaut {
    version = "4.6.3"
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental = true
        annotations = ["com.fullsteam.*"]
    }
}

def nettyVersion = "4.2.3.Final"
def jacksonVersion = "2.19.2"
def logbackVersion = "1.5.13"

dependencies {
    // Micronaut BOM for version management
    implementation platform("io.micronaut.platform:micronaut-platform:4.6.3")
    
    // Micronaut core dependencies
    annotationProcessor("io.micronaut:micronaut-http-validation")
    annotationProcessor("io.micronaut:micronaut-inject-java")
    implementation("io.micronaut:micronaut-http-server-netty")
    implementation("io.micronaut:micronaut-websocket")
    implementation("io.micronaut:micronaut-jackson-databind")
    implementation("io.micronaut:micronaut-runtime")
    implementation("io.micronaut:micronaut-inject")
    compileOnly("io.micronaut:micronaut-inject-java")
    
    // Keep existing dependencies for compatibility
    implementation "io.netty:netty-transport:${nettyVersion}"
    implementation "io.netty:netty-codec-http:${nettyVersion}"
    implementation "io.netty:netty-handler:${nettyVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.module:jackson-module-blackbird:${jacksonVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"
    implementation "org.apache.commons:commons-lang3:3.18.0"

    testImplementation platform("org.junit:junit-bom:5.10.0")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "io.micronaut.test:micronaut-test-junit5"
}

test {
    useJUnitPlatform()
}

shadowJar {
    mergeServiceFiles()
    mainClassName = 'com.fullsteam.Application'
    manifest {
        attributes 'Main-Class': 'com.fullsteam.Application'
    }
    archiveBaseName.set('full-steam')
    archiveVersion.set(project.version)
    archiveClassifier.set('')
    zip64 = true
}

graalvmNative {
    agent {
        defaultMode = "standard"
        enabled = false
    }
    binaries {
        main {
            mainClass = 'com.fullsteam.Application'
            fallback = false
            useFatJar = true
//             buildArgs.add('--verbose')
            buildArgs.add('--add-opens=java.base/java.nio=ALL-UNNAMED')
            buildArgs.add('--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED')
            buildArgs.add('--add-opens=java.base/jdk.internal.ref=ALL-UNNAMED')
            buildArgs.add('--trace-class-initialization=ch.qos.logback.classic.Logger')
            buildArgs.add('--trace-object-instantiation=ch.qos.logback.core.AsyncAppenderBase$Worker')
            buildArgs.add('--initialize-at-build-time=org.slf4j.LoggerFactory,ch.qos.logback')
            buildArgs.add('--initialize-at-run-time=io.netty')
        }

        all {
            resources.autodetect()
        }
    }
}
